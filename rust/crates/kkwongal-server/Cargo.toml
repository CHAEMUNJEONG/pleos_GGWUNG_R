[package]
name = "kkwongal-server"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
kkwongal-core = { path = "../kkwongal-core" }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
